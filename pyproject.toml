[project]
name = "text2hazard"
version = "0.1.0"
description = "Comparison of end-to-end and task-decomposed LLM extraction of hazard events"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pydantic>=2.13.4",
    "pypdf>=5.0",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

